<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wind Dashboard</title>

<style>

body{
    margin:10px;
    font-family:Arial,sans-serif;
    background:#eef2f5;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.spot{
    background:white;
    border-radius:15px;
    padding:10px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.spot-name{
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

svg{
    display:block;
    margin:auto;
    width:180px;
    height:180px;
}

.avg{
    font-size:28px;
    font-weight:bold;
    fill:#0066cc;
}

.gust{
    font-size:18px;
    fill:#666;
}

.arrow{
    stroke:black;
    stroke-width:4;
}

.coast{
    stroke:#ff00ff;
    stroke-width:3;
}

</style>

</head>

<body>

<h1>🌬 Wind Dashboard</h1>


<div class="spot">

<div class="spot-name">BALIZA 2</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M0 200 L140 200 L60 0 L0 0 Z"
fill="#c7f3ef"/>

<line x1="60" y1="0"
      x2="140" y2="200"
      class="coast"/>

<text id="balizaAvg"
      x="100"
      y="80"
      text-anchor="middle"
      class="avg">
--
</text>

<line x1="100" y1="100"
      x2="60" y2="65"
      class="arrow"/>

<polygon points="60,65 67,62 63,72"
fill="black"/>

<text id="prainhaAvg"
      x="100"
      y="80"
      text-anchor="middle"
      class="avg">
--
</text>

</svg>

</div>


<div class="spot">

<div class="spot-name">P.RAINHA</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M200 0 L200 200 L90 200 L140 0 Z"
fill="#c7f3ef"/>

<line x1="140" y1="0"
      x2="90" y2="200"
      class="coast"/>

<text x="100" y="80"
      text-anchor="middle"
      class="avg">
14
</text>

<line x1="100" y1="100"
      x2="100" y2="55"
      class="arrow"/>

<polygon points="100,55 95,65 105,65"
fill="black"/>

<text id="lavradioAvg"
      x="100"
      y="80"
      text-anchor="middle"
      class="avg">
--
</text>

</svg>

</div>



<div class="spot">

<div class="spot-name">LAVRADIO</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M200 0 L200 200 L130 200 L60 0 Z"
fill="#c7f3ef"/>

<line x1="60" y1="0"
      x2="130" y2="200"
      class="coast"/>

<text x="100" y="80"
      text-anchor="middle"
      class="avg">
20
</text>

<line x1="100" y1="100"
      x2="145" y2="65"
      class="arrow"/>

<polygon points="145,65 135,68 140,75"
fill="black"/>

<text x="100" y="130"
      text-anchor="middle"
      class="gust">
24
</text>

</svg>

</div>

<script>

async function loadIPMA() {

    const response = await fetch(
        "https://api.ipma.pt/open-data/observation/meteorology/stations/observations.json"
    );

    const data = await response.json();

    const dates = Object.keys(data);

    const lastDate = dates.sort().pop();

    const obs = data[lastDate];

    const pRainha = obs["1210773"];
    const lavradio = obs["1210766"];

    document.getElementById("prainhaAvg").textContent =
        Math.round(pRainha.intensidadeVentoKM / 1.852);

    document.getElementById("lavradioAvg").textContent =
        Math.round(lavradio.intensidadeVentoKM / 1.852);

}

loadIPMA();

</script>

</body>
</html>
