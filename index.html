<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wind Dashboard</title>

<style>

body{
    margin:10px;
    font-family:Arial,sans-serif;
    background:#eef2f5;
}

h1{
    text-align:center;
}

.spot{
    background:white;
    border-radius:15px;
    padding:10px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.spot-name{
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

svg{
    display:block;
    margin:auto;
    width:180px;
    height:180px;
}

.avg{
    font-size:28px;
    font-weight:bold;
    fill:#0066cc;
}

.gust{
    font-size:18px;
    fill:#666;
}

.arrow{
    stroke:black;
    stroke-width:4;
}

.coast{
    stroke:#ff00ff;
    stroke-width:3;
}

</style>

</head>

<body>

<h1>🌬 Wind Dashboard</h1>

<!-- BALIZA 2 -->

<div class="spot">

<div class="spot-name">BALIZA 2</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M0 200 L140 200 L60 0 L0 0 Z"
fill="#c7f3ef"/>

<line x1="60" y1="0"
      x2="140" y2="200"
      class="coast"/>

<text id="balizaAvg"
      x="100"
      y="82"
      text-anchor="middle"
      class="avg">--</text>

<line x1="100" y1="100"
      x2="60" y2="65"
      class="arrow"/>

<polygon points="60,65 67,62 63,72"
fill="black"/>

<text id="balizaGust"
      x="100"
      y="128"
      text-anchor="middle"
      class="gust">--</text>

</svg>

</div>


<!-- P.RAINHA -->

<div class="spot">

<div class="spot-name">P.RAINHA</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M200 0 L200 200 L90 200 L140 0 Z"
fill="#c7f3ef"/>

<line x1="140" y1="0"
      x2="90" y2="200"
      class="coast"/>

<text id="prainhaAvg"
      x="100"
      y="82"
      text-anchor="middle"
      class="avg">--</text>

<line id="arrowPrainha"
      x1="100"
      y1="100"
      x2="100"
      y2="55"
      class="arrow"/>


</svg>

</div>


<!-- LAVRADIO -->

<div class="spot">

<div class="spot-name">LAVRADIO</div>

<svg viewBox="0 0 200 200">

<circle cx="100" cy="100" r="90"
fill="#efe5d4"
stroke="#2f5fd0"
stroke-width="2"/>

<path d="M200 0 L200 200 L130 200 L60 0 Z"
fill="#c7f3ef"/>

<line x1="60" y1="0"
      x2="130" y2="200"
      class="coast"/>

<text id="lavradioAvg"
      x="100"
      y="82"
      text-anchor="middle"
      class="avg">--</text>

<line id="arrowLavradio"
      x1="100"
      y1="100"
      x2="145"
      y2="65"
      class="arrow"/>


</svg>

</div>


<script>

async function loadIPMA() {

    try {

        const response = await fetch(
            "https://api.ipma.pt/open-data/observation/meteorology/stations/observations.json"
        );

        const data = await response.json();

        const dates = Object.keys(data);

        const lastDate = dates.sort().pop();

        console.log("Dernière observation :", lastDate);

        const obs = data[lastDate];

        const pRainha = obs["1210773"];
        const lavradio = obs["1210766"];

        console.log("P.Rainha", pRainha);
        console.log("Lavradio", lavradio);

if (pRainha) {

    console.log(
        "P.Rainha direction:",
        pRainha.idDireccVento
    );

    document.getElementById("prainhaAvg").textContent =
        Math.round(pRainha.intensidadeVentoKM / 1.852);

    function setDirection(lineId, directionId){

    const angles = {
        1: 0,
        2: 45,
        3: 90,
        4: 135,
        5: 180,
        6: 225,
        7: 270,
        8: 315,
        9: 0
    };

    const angle = angles[directionId];

    if(angle === undefined) return;

    const arrow = document.getElementById(lineId);

    const centerX = 100;
    const centerY = 100;
    const length = 45;

    const radians =
        (angle - 90) * Math.PI / 180;

    const endX =
        centerX + length * Math.cos(radians);

    const endY =
        centerY + length * Math.sin(radians);

    arrow.setAttribute("x1", centerX);
    arrow.setAttribute("y1", centerY);

    arrow.setAttribute("x2", endX);
    arrow.setAttribute("y2", endY);

    console.log(
        lineId,
        directionId,
        angle
    );

};

}

if (lavradio) {

    console.log(
        "Lavradio direction:",
        lavradio.idDireccVento
    );

    document.getElementById("lavradioAvg").textContent =
        Math.round(lavradio.intensidadeVentoKM / 1.852);

    function setDirection(lineId, directionId){

    const angles = {
        1: 0,
        2: 45,
        3: 90,
        4: 135,
        5: 180,
        6: 225,
        7: 270,
        8: 315,
        9: 0
    };

    const angle = angles[directionId];

    if(angle === undefined) return;

    const arrow = document.getElementById(lineId);

    const centerX = 100;
    const centerY = 100;
    const length = 45;

    const radians =
        (angle - 90) * Math.PI / 180;

    const endX =
        centerX + length * Math.cos(radians);

    const endY =
        centerY + length * Math.sin(radians);

    arrow.setAttribute("x1", centerX);
    arrow.setAttribute("y1", centerY);

    arrow.setAttribute("x2", endX);
    arrow.setAttribute("y2", endY);

    console.log(
        lineId,
        directionId,
        angle
    );

};

}

    }
    catch(error) {

        console.error("Erreur IPMA :", error);

    }

}

function setDirection(lineId, directionId){

    const angles = {
        1: 0,      // N
        2: 45,     // NE
        3: 90,     // E
        4: 135,    // SE
        5: 180,    // S
        6: 225,    // SW
        7: 270,    // W
        8: 315,    // NW
        9: 0
    };

    const angle = angles[directionId];

    if(angle === undefined) return;

    const arrow = document.getElementById(lineId);

    arrow.setAttribute(
        "transform",
        `rotate(${angle} 100 100)`
    );
}

loadIPMA();

</script>

</body>
</html>
